[build-system]
requires = [
    "setuptools >= 80",
    "setuptools_scm[toml] >= 8"
]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
write_to = "cocotbext/umi/_version.py"
write_to_template = '''
# This file is automatically generated by setuptools_scm.
# Do not edit it directly.

__version__ = "{version}"
'''

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
namespaces = true

[project]
name = "cocotbext-umi"
authors = [{name = "Zero ASIC"}]
description = "Library of useful cocotb functions"
readme = "README.md"
urls = {Homepage = "https://github.com/zeroasiccorp/cocotbext-umi"}
requires-python = ">= 3.10"
license = {file = "LICENSE"}
dependencies = [
    "siliconcompiler >= 0.35.0",
    "cocotb >= 2.0.1, < 3.0.0",
    "cocotb-bus==0.3.0",
]
dynamic = ["version"]

[tool.pytest.ini_options]
testpaths = "tests"
timeout = "60"

[project.optional-dependencies]
test = [
    "flake8 >= 5.0.0",
    "pytest >= 6.2.4",
    "pytest-timeout >= 2.1.0"
]
